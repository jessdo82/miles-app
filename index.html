<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="里程記帳">
<title>里程記帳</title>
<style>
:root{
  --bg:#f2f2f7;--bg2:#ffffff;--bg3:#f2f2f7;
  --border:rgba(0,0,0,.08);--border-hi:rgba(0,0,0,.14);
  --txt:#1c1c1e;--txt2:#6e6e73;--txt3:#aeaeb2;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;
  --orange:#ff9500;--purple:#af52de;--claim:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

.hd{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.hd h1{font-size:28px;font-weight:900;padding-bottom:10px;letter-spacing:-.6px;line-height:1}
.grad-blue{background:linear-gradient(120deg,#007aff,#4fa3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-green{background:linear-gradient(120deg,#1c9e42,#34c759);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-orange{background:linear-gradient(120deg,#c96500,#ff9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-purple{background:linear-gradient(120deg,#8433c4,#af52de);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 15px;font-size:13px;font-weight:600;color:var(--txt2);border-radius:22px;cursor:pointer;white-space:nowrap;transition:all .18s;border:1.5px solid transparent}
.tab:not(.active):hover{background:#f2f2f7}
.tab.active{color:#fff;border-color:transparent}
#atabs .tab[data-f="出貨"].active{background:var(--blue);box-shadow:0 3px 10px rgba(0,122,255,.3)}
#atabs .tab[data-f="進貨"].active{background:var(--green);box-shadow:0 3px 10px rgba(52,199,89,.3)}
#atabs .tab[data-f="換匯"].active{background:var(--orange);box-shadow:0 3px 10px rgba(255,149,0,.3)}
#atabs .tab[data-f="稅金"].active{background:var(--red);box-shadow:0 3px 10px rgba(255,59,48,.3)}
#atabs .tab[data-f="其他"].active{background:var(--purple);box-shadow:0 3px 10px rgba(175,82,222,.3)}
#ftabs .tab[data-f2="全部"].active{background:var(--txt2);box-shadow:0 2px 8px rgba(110,110,115,.3)}
#ftabs .tab[data-f2="出貨"].active{background:var(--blue);box-shadow:0 2px 8px rgba(0,122,255,.3)}
#ftabs .tab[data-f2="進貨"].active{background:var(--green);box-shadow:0 2px 8px rgba(52,199,89,.3)}
#ftabs .tab[data-f2="換匯"].active{background:var(--orange);box-shadow:0 2px 8px rgba(255,149,0,.3)}
#ftabs .tab[data-f2="稅金"].active{background:var(--red);box-shadow:0 2px 8px rgba(255,59,48,.3)}
#ftabs .tab[data-f2="其他"].active{background:var(--purple);box-shadow:0 2px 8px rgba(175,82,222,.3)}
#atabs .tab[data-f="理賠"].active{background:var(--claim);box-shadow:0 3px 10px rgba(192,57,43,.3)}
#ftabs .tab[data-f2="理賠"].active{background:var(--claim);box-shadow:0 2px 8px rgba(192,57,43,.3)}

.ct{padding:16px 16px 100px;max-width:520px;margin:0 auto}

.fg{margin-bottom:14px}
label{display:block;font-size:11px;color:var(--txt3);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input:not([type=checkbox]),select,textarea{width:100%;padding:13px 15px;border:1.5px solid #e5e5ea;border-radius:12px;font-size:16px;background:#fff;color:var(--txt);-webkit-appearance:none;appearance:none;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:var(--blue);margin:0}
textarea{font-size:13px;font-family:monospace;resize:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
input.calc{background:#f9f9f9;color:var(--txt2)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.acw{position:relative}
.acl{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #e5e5ea;border-radius:12px;max-height:200px;overflow-y:auto;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.12);display:none}
.aci{padding:13px 15px;font-size:15px;cursor:pointer;border-bottom:1px solid #f2f2f7;color:var(--txt)}
.aci:last-child{border-bottom:none}
.aci:active{background:#f2f2f7}

.btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s,transform .1s}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-sm{padding:12px 16px;font-size:14px;border-radius:12px;margin-top:0}
.btn-ghost{background:#f2f2f7;color:var(--blue);border:none}
.btn-ghost:active{background:#e5e5ea}
.btn-danger{background:#fff0f0;color:var(--red);border:none}
.btn-export{display:block;width:100%;padding:13px;background:#fff;border:1.5px solid #e5e5ea;color:var(--blue);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;text-align:center}
.btn-export:active{background:#f2f2f7}

.sec{display:none}.sec.active{display:block}

.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.ni{flex:1;text-align:center;cursor:pointer;padding:8px 0 6px;position:relative;transition:transform .1s}
.ni:active{transform:scale(.9)}
.ni-pip{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;opacity:0;transition:opacity .18s}
.ni.active .ni-pip{opacity:1}
.ni-icon{display:flex;justify-content:center;margin-bottom:2px}
.ni-icon svg{width:24px;height:24px;stroke:var(--txt3);fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.75;transition:stroke .18s}
.ni-lbl{font-size:10px;color:var(--txt3);font-weight:600;letter-spacing:.2px;transition:color .18s}
.ni[data-sec="add"].active .ni-icon svg{stroke:var(--blue)}
.ni[data-sec="add"].active .ni-lbl{color:var(--blue)}
.ni[data-sec="add"].active .ni-pip{background:var(--blue)}
.ni[data-sec="acc"].active .ni-icon svg{stroke:var(--green)}
.ni[data-sec="acc"].active .ni-lbl{color:var(--green)}
.ni[data-sec="acc"].active .ni-pip{background:var(--green)}
.ni[data-sec="rec"].active .ni-icon svg{stroke:var(--orange)}
.ni[data-sec="rec"].active .ni-lbl{color:var(--orange)}
.ni[data-sec="rec"].active .ni-pip{background:var(--orange)}
.ni[data-sec="sum"].active .ni-icon svg{stroke:var(--purple)}
.ni[data-sec="sum"].active .ni-lbl{color:var(--purple)}
.ni[data-sec="sum"].active .ni-pip{background:var(--purple)}

.card{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:4px solid transparent}
.card.c-出貨{border-left-color:var(--blue)}
.card.c-進貨{border-left-color:var(--green)}
.card.c-換匯{border-left-color:var(--orange)}
.card.c-稅金{border-left-color:var(--red)}
.card.c-其他{border-left-color:var(--purple)}
.card.c-理賠{border-left-color:var(--claim)}
.rc-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.2px}
.b-出貨{background:#e0f0ff;color:var(--blue)}
.b-進貨{background:#e3fced;color:#1d8c40}
.b-換匯{background:#fff4e0;color:#c96500}
.b-稅金{background:#ffe5e5;color:var(--red)}
.b-其他{background:#f3e8ff;color:var(--purple)}
.b-理賠{background:#ffeaea;color:var(--claim)}
.rc-date{font-size:12px;color:var(--txt3);margin-left:auto;font-weight:500}
.rc-del{background:none;border:none;color:var(--txt3);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:6px}
.rc-del:active{color:var(--red)}
.rc-body{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-main{font-size:15px;font-weight:600}
.rc-sub{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.7}
.rc-amt{text-align:right;font-size:14px;font-weight:700;white-space:nowrap;line-height:1.9;flex-shrink:0}

.acc-section{margin-bottom:16px}
.acc-section-title{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:0 4px;margin-bottom:8px}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:#fff;border-radius:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.acc-row:active{opacity:.7}
.acc-name{font-size:16px;font-weight:500}
.acc-bal{font-size:16px;font-weight:700}
.acc-bal.pos{color:var(--txt)}
.acc-bal.neg{color:var(--red)}
.acc-total{background:linear-gradient(135deg,#e8f4ff,#eee8ff);border-radius:18px;padding:22px 20px;margin-bottom:16px}
.acc-total-label{font-size:11px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.acc-total-val{font-size:30px;font-weight:800;letter-spacing:-.5px}

.sc{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.sc-t{font-size:11px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.sc-r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f2f2f7;font-size:14px}
.sc-r:last-child{border-bottom:none}
.sc-r>span:first-child{color:var(--txt2)}
.sc-v{font-weight:700}
.sc-month{background:#fff;border-radius:18px;padding:0;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.09);overflow:hidden}
.sc-month-hd{padding:16px 18px 13px;background:linear-gradient(135deg,#f0f6ff,#f5f0ff);display:flex;justify-content:space-between;align-items:baseline}
.sc-month-title{font-size:16px;font-weight:800;letter-spacing:-.3px}
.sc-month-net{font-size:20px;font-weight:800;letter-spacing:-.5px}
.sc-month-body{padding:4px 18px 14px}

.rate-bar{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.rate-bar label{margin:0;white-space:nowrap;font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px}
.rate-bar input{flex:1;padding:9px 12px;font-size:15px;font-weight:600;border-radius:10px;margin:0}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:500;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#f2f2f7;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:92vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--txt3);border-radius:2px;margin:0 auto 20px;opacity:.35}
.modal-title{font-size:18px;font-weight:800;margin-bottom:18px;text-align:center;letter-spacing:-.3px}

.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green)}.orange{color:var(--orange)}.purple{color:var(--purple)}
.empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:15px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.9);color:#fff;padding:11px 24px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}

.seg{display:flex;background:#e5e5ea;border-radius:9px;padding:2px;margin-bottom:14px}
.seg-opt{flex:1;text-align:center;padding:8px 4px;font-size:14px;font-weight:500;border-radius:7px;cursor:pointer;color:var(--txt2);transition:all .15s}
.seg-opt.active{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
</style>
</head>
<body>

<!-- ========== ADD ========== -->
<div class="sec active" id="sec-add">
  <div class="hd">
    <h1 class="grad-blue">新增紀錄</h1>
    <div class="tabs" id="atabs">
      <div class="tab active" data-f="出貨">出貨</div>
      <div class="tab" data-f="進貨">進貨</div>
      <div class="tab" data-f="換匯">換匯</div>
      <div class="tab" data-f="稅金">代付稅金</div>
      <div class="tab" data-f="其他">其他</div>
      <div class="tab" data-f="理賠">理賠</div>
    </div>
  </div>
  <div class="ct">
    <!-- 出貨 -->
    <div id="form-出貨">
      <div class="fg"><label>日期</label><input type="date" id="s-date"></div>
      <div class="fg"><label>廠商</label><div class="acw"><input type="text" id="s-vendor" placeholder="廠商名稱" autocomplete="off"><div class="acl" id="s-vendor-ac"></div></div></div>
      <div class="fg"><label>航空公司</label><select id="s-airline"><option value="">選擇航空公司</option><option>長榮 EVA</option><option>華航 CI</option><option>國泰 CX</option><option>日航 JL</option><option>法航 AF</option><option>漢莎 LH</option><option>小樹點</option><option>其他</option></select></div>
      <div class="fg"><label>收款幣別</label>
        <div class="seg" id="s-curr-seg">
          <div class="seg-opt active" data-v="RMB" onclick="setSeg('s-curr-seg',this);setSellCurrency('RMB')">人民幣 RMB（預設）</div>
          <div class="seg-opt" data-v="TWD" onclick="setSeg('s-curr-seg',this);setSellCurrency('TWD')">台幣 TWD</div>
        </div>
      </div>
      <div class="row2">
        <div class="fg"><label>哩程數（萬）</label><input type="number" id="s-miles" placeholder="5" inputmode="decimal" step="0.1"></div>
        <div class="fg"><label id="s-up-label">單價（RMB/萬哩）</label><input type="number" id="s-up" placeholder="380" inputmode="decimal"></div>
      </div>
      <div class="fg"><label id="s-total-label">總金額（RMB）</label><input type="number" id="s-total" class="calc" placeholder="自動計算，可手動覆蓋" inputmode="decimal"></div>
      <div class="fg">
        <label>付款狀態</label>
        <div class="seg" id="s-pay-seg">
          <div class="seg-opt active" data-v="unpaid" onclick="setSeg('s-pay-seg',this);document.getElementById('s-pay-dest-wrap').style.display='none'">未付款</div>
          <div class="seg-opt" data-v="paid" onclick="setSeg('s-pay-seg',this);document.getElementById('s-pay-dest-wrap').style.display='block';populateSellPayDest()">已付款</div>
        </div>
      </div>
      <div id="s-pay-dest-wrap" style="display:none">
        <div class="fg"><label>收款帳戶 <span style="font-size:11px;color:#999;font-weight:400">（款項收到哪裡）</span></label><select id="s-pay-dest" style="width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid #e5e5ea;background:#fff;font-size:15px;color:var(--txt);appearance:none;-webkit-appearance:none"><option value="">選擇帳戶</option></select></div>
      </div>
      <div class="fg"><label>備註</label><input type="text" id="s-note" placeholder="選填"></div>
      <button class="btn" onclick="submit('出貨')">儲存出貨</button>
    </div>
    <!-- 進貨 -->
    <div id="form-進貨" style="display:none">
      <div class="fg"><label>日期</label><input type="date" id="b-date"></div>
      <div class="fg"><label>賣家</label><div class="acw"><input type="text" id="b-seller" placeholder="賣家姓名" autocomplete="off"><div class="acl" id="b-seller-ac"></div></div></div>
      <div class="fg"><label>航空公司</label><select id="b-airline"><option value="">選擇航空公司</option><option>長榮 EVA</option><option>華航 CI</option><option>國泰 CX</option><option>日航 JL</option><option>法航 AF</option><option>漢莎 LH</option><option>小樹點</option><option>其他</option></select></div>
      <div class="fg"><label>付款幣別</label>
        <div class="seg" id="b-curr-seg">
          <div class="seg-opt active" data-v="TWD" onclick="setSeg('b-curr-seg',this);setBuyCurrency('TWD')">台幣 TWD（預設）</div>
          <div class="seg-opt" data-v="RMB" onclick="setSeg('b-curr-seg',this);setBuyCurrency('RMB')">人民幣 RMB</div>
        </div>
      </div>
      <div class="row2">
        <div class="fg"><label>哩程數（萬）</label><input type="number" id="b-miles" placeholder="5" inputmode="decimal" step="0.1"></div>
        <div class="fg"><label id="b-up-label">單價（TWD/哩）</label><input type="number" id="b-up" placeholder="0.28" inputmode="decimal" step="0.001"></div>
      </div>
      <div class="fg"><label id="b-total-label">總成本（TWD）</label><input type="number" id="b-total" class="calc" placeholder="自動計算，可手動覆蓋" inputmode="decimal"></div>
      <div id="b-rmb-section" style="display:none">
        <div class="fg"><label>換算匯率（TWD/CNY）</label><input type="number" id="b-buy-rate" placeholder="4.66" step="0.001" inputmode="decimal"></div>
        <div class="fg"><label>折算台幣成本（自動計算）</label><input type="number" id="b-twd-cost" class="calc" placeholder="自動計算" readonly></div>
      </div>
      <div class="fg"><label>手續費（TWD）<span style="font-size:11px;color:#999;font-weight:400"> 選填，計入成本</span></label><input type="number" id="b-fee" placeholder="0" inputmode="decimal"></div>
      <div class="fg"><label>付款帳戶</label><div class="acw"><input type="text" id="b-pay" placeholder="從哪個帳戶付款" autocomplete="off"><div class="acl" id="b-pay-ac"></div></div></div>
      <div class="fg"><label>備註</label><input type="text" id="b-note" placeholder="選填"></div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 2px 10px">
        <input type="checkbox" id="b-inventory">
        <label for="b-inventory" style="font-size:14px;font-weight:500;color:var(--txt);cursor:pointer;margin:0;text-transform:none;letter-spacing:0">哩程尚未賣出，計入庫存資產</label>
      </div>
      <button class="btn" onclick="submit('進貨')">儲存進貨</button>
    </div>
    <!-- 換匯 -->
    <div id="form-換匯" style="display:none">
      <div class="fg"><label>日期</label><input type="date" id="x-date"></div>
      <div class="fg"><label>換匯管道</label><div class="acw"><input type="text" id="x-ch" placeholder="換匯管道" autocomplete="off"><div class="acl" id="x-ch-ac"></div></div></div>
      <div class="row2">
        <div class="fg"><label>人民幣（CNY）</label><input type="number" id="x-rmb" placeholder="CNY" inputmode="decimal"></div>
        <div class="fg"><label>台幣（TWD）</label><input type="number" id="x-twd" placeholder="TWD" inputmode="decimal"></div>
      </div>
      <div class="fg"><label>匯率（TWD/CNY）</label><input type="number" id="x-rate" class="calc" placeholder="自動計算" inputmode="decimal" step="0.001"></div>
      <div class="fg"><label>支出人民幣帳戶 <span style="font-size:11px;color:#999;font-weight:400">（選填，從哪個 CNY 帳戶換出）</span></label><select id="x-from-acc" style="width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid #e5e5ea;background:#fff;font-size:15px;color:var(--txt);appearance:none;-webkit-appearance:none"><option value="">— 不選 —</option></select></div>
      <div class="fg"><label>收款帳戶（TWD）</label><div class="acw"><input type="text" id="x-acc" placeholder="台幣匯入哪個帳戶" autocomplete="off"><div class="acl" id="x-acc-ac"></div></div></div>
      <div class="fg">
        <label>款項來自廠商 <span style="font-size:11px;color:#999;font-weight:400">（選填，自動扣除應收帳款）</span></label>

<script>
// ─── Firebase ──────────────────────────────────────────────
const FB='https://miles-salary-default-rtdb.firebaseio.com/data.json';

async function syncCloud(){
  const btn=document.getElementById('sync-btn');
  if(btn){btn.textContent='同步中…';btn.disabled=true;}
  try{
    // 1. 拉雲端資料
    const res=await fetch(FB);
    if(!res.ok){
      const txt=await res.text();
      throw new Error(`讀取失敗 ${res.status}: ${txt.slice(0,80)}`);
    }
    const cloud=await res.json();

    // 2. 合併刪除清單（雙向：本機刪了 + 雲端刪了都要保留）
    const localDeleted=getDeleted();
    const cloudDeleted=Array.isArray(cloud?.deleted)?cloud.deleted:[];
    const allDeleted=[...new Set([...localDeleted,...cloudDeleted])];
    saveDeleted(allDeleted);

    // 3. 合併 records（先過濾已刪除的 ID，再合併本機新增）
    const localRecs=getRecs().filter(r=>!allDeleted.includes(r.id));
    const cloudRecs=(Array.isArray(cloud?.records)?cloud.records:[]).filter(r=>!allDeleted.includes(r.id));
    const cloudMap=new Map(cloudRecs.map(r=>[r.id,r]));
    const localOnlyRecs=localRecs.filter(r=>!cloudMap.has(r.id));
    const mergedRecs=[...cloudMap.values(),...localOnlyRecs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id-a.id));

    // 4. 合併 accounts（雲端優先，過濾已刪除）
    const localAccs=getAccounts();
    const cloudAccMap=new Map(Array.isArray(cloud?.accounts)?cloud.accounts.map(a=>[a.id,a]):[]);
    const localOnlyAccs=localAccs.filter(a=>!cloudAccMap.has(a.id));
    const mergedAccs=[...cloudAccMap.values(),...localOnlyAccs];

    // 5. 合併 rates / profits / AR（本地優先：本機改過的值蓋掉雲端）
    const mergedRates={...(cloud?.rates||{}),...getRates()};
    const mergedProfits={...(cloud?.profits||{}),...getProfits()};
    // AR: 逐廠商合併，取欠款較新的值（本地優先，雲端補充本地沒有的廠商）
    const localAR=getAR();
    const cloudAR=cloud?.ar||{};
    const mergedAR={...cloudAR,...localAR};

    saveRecs(mergedRecs);
    saveAccounts(mergedAccs);
    saveRates(mergedRates);
    saveProfits(mergedProfits);
    saveAR(mergedAR);

    // 6. 上傳合併後的資料（含刪除清單 + AR）
    const putRes=await fetch(FB,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({records:mergedRecs,accounts:mergedAccs,rates:mergedRates,profits:mergedProfits,ar:mergedAR,deleted:allDeleted,synced:new Date().toISOString()})});
    if(!putRes.ok){
      const txt=await putRes.text();
      throw new Error(`上傳失敗 ${putRes.status}: ${txt.slice(0,80)}`);
    }

    localStorage.setItem('ml_last_sync',new Date().toLocaleString('zh-TW'));
    renderSummary();
    toast(`✓ 同步完成（${mergedRecs.length} 筆）`);
  }catch(e){
    console.error('syncCloud error:',e);
    alert('同步失敗：' + e.message);
  }finally{
    if(btn){btn.textContent='↻ 雲端同步';btn.disabled=false;}
  }
}

// ─── Storage ───────────────────────────────────────────────
const RK='ml_rec', AK='ml_ac', ACK='ml_accounts', RTK='ml_rates';
const LGK='ml_log';
const getLog=()=>JSON.parse(localStorage.getItem(LGK)||'[]');
const saveLog=d=>localStorage.setItem(LGK,JSON.stringify(d));
function logActivity(action,detail){const lg=getLog();lg.unshift({time:new Date().toISOString(),action,detail});if(lg.length>60)lg.pop();saveLog(lg);}
function showLog(){
  const lg=getLog();
  const el=document.getElementById('modal-log-body');
  if(!lg.length){el.innerHTML='<div style="text-align:center;color:var(--txt3);padding:20px">尚無操作記錄</div>';}
  else el.innerHTML=lg.map(e=>{
    const dt=new Date(e.time);
    const ts=`${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
    return `<div style="padding:10px 0;border-bottom:1px solid #f2f2f7"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:600">${esc(e.action)}</span><span style="font-size:11px;color:var(--txt3)">${ts}</span></div><div style="font-size:12px;color:var(--txt2);margin-top:2px">${esc(e.detail)}</div></div>`;
  }).join('');
  document.getElementById('modal-log').classList.add('open');
}
const getRecs=()=>JSON.parse(localStorage.getItem(RK)||'[]');
const saveRecs=d=>localStorage.setItem(RK,JSON.stringify(d));
const getAC=()=>JSON.parse(localStorage.getItem(AK)||'{}');
const saveAC=d=>localStorage.setItem(AK,JSON.stringify(d));
const getAccounts=()=>JSON.parse(localStorage.getItem(ACK)||'[]');
const saveAccounts=d=>localStorage.setItem(ACK,JSON.stringify(d));
const getRates=()=>JSON.parse(localStorage.getItem(RTK)||'{}');
const saveRates=d=>localStorage.setItem(RTK,JSON.stringify(d));
function setMonthRate(ym,val){

// ─── Autocomplete ──────────────────────────────────────────
function setupAC(inpId,lstId,field){
  const inp=document.getElementById(inpId);
  const lst=document.getElementById(lstId);
  if(!inp)return;
  inp.addEventListener('input',()=>showAC(inp,lst,field));
  inp.addEventListener('focus',()=>showAC(inp,lst,field));
  inp.addEventListener('blur',()=>setTimeout(()=>lst.style.display='none',180));
}
function showAC(inp,lst,field){
  const q=inp.value.toLowerCase();
  const recs=getRecs();
  let all=[];
  if(field==='vendor'){
    const fromRecs=[...new Set(recs.filter(r=>r.vendor).map(r=>r.vendor))];
    const fromAR=Object.keys(getAR());
    all=[...new Set([...fromRecs,...fromAR])];
  }else if(field==='seller'){
    all=[...new Set(recs.filter(r=>r.seller).map(r=>r.seller))];
  }else{
    const accNames=getAccounts().map(a=>a.name);
    const stored=getAC()[field]||[];
    all=[...new Set([...stored,...accNames])];
  }
  const opts=all.filter(v=>!q||v.toLowerCase().includes(q));
  if(!opts.length){lst.style.display='none';return;}
  lst.innerHTML=opts.slice(0,8).map(v=>`<div class="aci" onmousedown="pickAC(event,'${inp.id}','${lst.id}','${v.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"><b>${esc(v)}</b></div>`).join('');
  lst.style.display='block';
}
function pickAC(e,iid,lid,val){e.preventDefault();document.getElementById(iid).value=val;document.getElementById(lid).style.display='none';}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ─── Auto calc ─────────────────────────────────────────────
function setupCalc(){
  const wire=(a,b,out,fn)=>[a,b].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{
    const va=parseFloat(document.getElementById(a)?.value),vb=parseFloat(document.getElementById(b)?.value);
    if(va&&vb)document.getElementById(out).value=fn(va,vb);
  }));
  wire('s-miles','s-up','s-total',(m,r)=>(m*r).toFixed(0));
  // 進貨 auto-calc depends on currency mode
  ['b-miles','b-up'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{
    const m=parseFloat(document.getElementById('b-miles')?.value);
    const u=parseFloat(document.getElementById('b-up')?.value);
    if(m&&u){
      const isRMB=segVal('b-curr-seg')==='RMB';
      document.getElementById('b-total').value=isRMB?(m*u).toFixed(0):(m*10000*u).toFixed(0);
      if(isRMB){const rr=parseFloat(document.getElementById('b-buy-rate')?.value)||getEstRate();document.getElementById('b-twd-cost').value=(m*u*rr).toFixed(0);}
    }
  }));
  // b-buy-rate → recalc twd cost
  ['b-total','b-buy-rate'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{
    if(segVal('b-curr-seg')==='RMB'){
      const rmb=parseFloat(document.getElementById('b-total')?.value);
      const rr=parseFloat(document.getElementById('b-buy-rate')?.value)||getEstRate();
      if(rmb&&rr)document.getElementById('b-twd-cost').value=(rmb*rr).toFixed(0);
    }
  }));
  // 換匯 bidirectional: RMB+TWD→rate, RMB+rate→TWD
  ['x-rmb','x-twd','x-rate'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{
    const rmb=parseFloat(document.getElementById('x-rmb')?.value);
    const twd=parseFloat(document.getElementById('x-twd')?.value);
    const rate=parseFloat(document.getElementById('x-rate')?.value);
    if(id==='x-rate'||id==='x-rmb'){
      if(rmb&&rate)document.getElementById('x-twd').value=(rmb*rate).toFixed(0);
      else if(rmb&&twd)document.getElementById('x-rate').value=(twd/rmb).toFixed(4);
    }else if(id==='x-twd'){
      if(rmb&&twd)document.getElementById('x-rate').value=(twd/rmb).toFixed(4);
    }
  }));
}

// ─── Submit ────────────────────────────────────────────────
function submit(type){
  const rec={id:Date.now(),type};
  if(type==='出貨'){
    if(!v('s-vendor')){toast('請填寫廠商');return;}
    const payStatus=segVal('s-pay-seg')||'unpaid';
    const payDest=payStatus==='paid'?v('s-pay-dest'):'';
    const sCurr=segVal('s-curr-seg')||'RMB';
    Object.assign(rec,{date:v('s-date')||today(),vendor:v('s-vendor'),airline:v('s-airline'),miles:v('s-miles'),unitprice:v('s-up'),total:v('s-total'),note:v('s-note'),payment_status:payStatus,paid_to:payDest,ar_added:true});
    if(sCurr==='TWD')rec.sell_currency='TWD';
    learn('vendor',rec.vendor);
    if(payDest)learn('payment',payDest);
    if(payStatus==='unpaid'){
      const ar=getAR();if(!ar[rec.vendor])ar[rec.vendor]={owed:0};
      // AR is always tracked in RMB; TWD sales don't go into AR
      if(sCurr!=='TWD')ar[rec.vendor].owed=(ar[rec.vendor].owed||0)+(parseFloat(rec.total)||0);
      saveAR(ar);
    }
    clear('s-vendor','s-miles','s-up','s-total','s-note','s-pay-dest');
    document.getElementById('s-airline').value='';
    setSeg('s-pay-seg',document.querySelector('#s-pay-seg .seg-opt'));
    setSeg('s-curr-seg',document.querySelector('#s-curr-seg .seg-opt'));
    setSellCurrency('RMB');
    document.getElementById('s-pay-dest-wrap').style.display='none';
  }else if(type==='進貨'){
    if(!v('b-total')&&(!v('b-miles')||!v('b-up'))){toast('請填寫金額');return;}
    const bCurr=segVal('b-curr-seg')||'TWD';
    const bInvEl=document.getElementById('b-inventory');
    let buyCurrExtra={};
    if(bCurr==='RMB'){
      const buyRmb=parseFloat(v('b-total'))||0;
      const buyRate=parseFloat(v('b-buy-rate'))||getEstRate();
      const twdCost=String(Math.round(buyRmb*buyRate));
      buyCurrExtra={buy_currency:'RMB',buy_rmb:String(buyRmb),buy_rate:String(buyRate),total:twdCost};
    }
    Object.assign(rec,{date:v('b-date')||today(),seller:v('b-seller'),airline:v('b-airline'),miles:v('b-miles'),unitprice:v('b-up'),total:v('b-total'),fee:v('b-fee'),payment:v('b-pay'),note:v('b-note'),is_inventory:bInvEl&&bInvEl.checked?true:undefined,...buyCurrExtra});
    if(!rec.is_inventory)delete rec.is_inventory;
    learn('seller',rec.seller);learn('payment',rec.payment);
    clear('b-seller','b-miles','b-up','b-total','b-fee','b-pay','b-note','b-buy-rate','b-twd-cost');
    if(bInvEl)bInvEl.checked=false;
    document.getElementById('b-airline').value='';
    setSeg('b-curr-seg',document.querySelector('#b-curr-seg .seg-opt'));
    setBuyCurrency('TWD');
  }else if(type==='換匯'){
    if(!v('x-ch')){toast('請填寫換匯管道');return;}
    const fromVendor=document.getElementById('x-from')?.value||'';
    const fromAccount=document.getElementById('x-from-acc')?.value||'';
    Object.assign(rec,{date:v('x-date')||today(),channel:v('x-ch'),rmb:v('x-rmb'),twd:v('x-twd'),rate:v('x-rate'),account:v('x-acc'),from_vendor:fromVendor,from_account:fromAccount,note:v('x-note')});
    learn('channel',rec.channel);learn('payment',rec.account);
    // Deduct from AR when vendor is specified
    if(fromVendor&&rec.rmb){const ar=getAR();if(ar[fromVendor]){ar[fromVendor].owed=(ar[fromVendor].owed||0)-(parseFloat(rec.rmb)||0);saveAR(ar);}}
    clear('x-ch','x-rmb','x-twd','x-rate','x-acc','x-note');
    if(document.getElementById('x-from'))document.getElementById('x-from').value='';
    if(document.getElementById('x-from-acc'))document.getElementById('x-from-acc').value='';
  }else if(type==='稅金'){
    if(!v('t-vendor')){toast('請填寫廠商');return;}
    Object.assign(rec,{date:v('t-date')||today(),vendor:v('t-vendor'),twd:v('t-twd'),rmb:v('t-rmb'),card:v('t-card'),note:v('t-note')});
    learn('vendor',rec.vendor);learn('card',rec.card);learn('payment',rec.card);
    clear('t-vendor','t-twd','t-rmb','t-card','t-note');
  }else if(type==='其他'){
    if(!v('o-acc')||!v('o-amt')){toast('請填寫帳戶和金額');return;}
    Object.assign(rec,{date:v('o-date')||today(),dir:segVal('o-dir-seg'),account:v('o-acc'),amount:v('o-amt'),desc:v('o-desc')});
    learn('payment',rec.account);
    clear('o-acc','o-amt','o-desc');
  }else if(type==='理賠'){
    if(!v('cl-vendor')||!v('cl-twd')){toast('請填寫退費對象和台幣損失');return;}
    Object.assign(rec,{date:v('cl-date')||today(),vendor:v('cl-vendor'),rmb:v('cl-rmb'),rate:v('cl-rate'),twd:v('cl-twd'),desc:v('cl-desc')});
    learn('vendor',rec.vendor);
    clear('cl-vendor','cl-rmb','cl-rate','cl-twd','cl-desc');
  }
  const recs=getRecs(); recs.unshift(rec); saveRecs(recs);
  const logDetail=rec.type==='出貨'?`${rec.vendor||''} ¥${rec.total||''} ${rec.payment_status==='paid'?'已付款':'未付款'}`
    :rec.type==='進貨'?`${rec.seller||''} ${rec.airline||''} ${rec.miles||''}萬 NT$${rec.total||''}`
    :rec.type==='換匯'?`${rec.channel||''} ¥${rec.rmb||''}→NT$${rec.twd||''} @${rec.rate||''}`
    :rec.type==='理賠'?`${rec.vendor||''} NT$${rec.twd||''} ${rec.desc||''}`
    :`${rec.account||rec.vendor||''}`;
  logActivity('新增'+type, logDetail);
  setDates(); toast('✓ 已儲存');
}
function clear(...ids){ids.forEach(id=>{const el=document.getElementById(id);if(el)el.value='';})}

// ─── Account balance ───────────────────────────────────────
function getBalance(accName){
  const accounts=getAccounts();
  const acc=accounts.find(a=>a.name===accName);
  const isCNY=acc?.type==='人民幣帳戶';
  const start=acc?parseFloat(acc.startBalance)||0:0;
  const recs=getRecs();
  let delta=0;
  if(isCNY){
    recs.forEach(r=>{
      // Only RMB-denominated 出貨 goes into CNY accounts
      if(r.type==='出貨'&&r.payment_status==='paid'&&r.paid_to===accName&&r.sell_currency!=='TWD') delta+=parseFloat(r.total)||0;
      if(r.type==='換匯'&&r.from_account===accName) delta-=parseFloat(r.rmb)||0;
    });
    // AR settlements: vendor paid later and money went to this account
    const ar=getAR();
    Object.values(ar).forEach(e=>{if(e.settled_to===accName&&e.settled_amount)delta+=parseFloat(e.settled_amount)||0;});
  }else{
    recs.forEach(r=>{
      if(r.type==='進貨'&&r.payment===accName) delta-=(parseFloat(r.total)||0)+(parseFloat(r.fee)||0);
      if(r.type==='換匯'&&r.account===accName) delta+=parseFloat(r.twd)||0;
      if(r.type==='稅金'&&r.card===accName) delta-=parseFloat(r.twd)||0;
      if(r.type==='其他'&&r.account===accName){
        if(r.dir==='收入') delta+=parseFloat(r.amount)||0;
        else delta-=parseFloat(r.amount)||0;
      }
      // TWD-denominated 出貨 paid into a TWD account
      if(r.type==='出貨'&&r.payment_status==='paid'&&r.paid_to===accName&&r.sell_currency==='TWD') delta+=parseFloat(r.total)||0;
    });
  }
  return start+delta;
}

// ─── Render Accounts ───────────────────────────────────────
function renderAccounts(){
  const accounts=getAccounts();
  const el=document.getElementById('acc-list');
  if(!accounts.length){
    el.innerHTML=`<div class="empty">還沒有帳戶<br><br><button class="btn" onclick="openAccModal()">新增第一個帳戶</button></div>`;
    return;
  }
  const typeIcon={'銀行':'🏦','電子支付':'💳','現金（自己）':'💵','現金（他人）':'🤝','現金':'💵','人民幣帳戶':'¥','親友代管':'👥','預付定金':'🔒','借出款項':'📤','借出':'📤','其他':'📂'};
  const typeOrder=['銀行','電子支付','現金（自己）','現金（他人）','現金','人民幣帳戶','親友代管','預付定金','借出款項','借出','其他'];
  const grouped={};
  typeOrder.forEach(t=>grouped[t]=[]);
  accounts.forEach(a=>{const t=a.type||'其他';if(!grouped[t])grouped[t]=[];grouped[t].push(a);});

  const twdAccs=accounts.filter(a=>a.type!=='人民幣帳戶');
  const cnyAccs=accounts.filter(a=>a.type==='人民幣帳戶');
  const totalTWD=twdAccs.reduce((s,a)=>s+getBalance(a.name),0);
  const totalCNY=cnyAccs.reduce((s,a)=>s+getBalance(a.name),0);

  // 哩程庫存
  const recs=getRecs();
  const invRecs=recs.filter(r=>r.type==='進貨'&&r.is_inventory);
  const invByAirline={};
  invRecs.forEach(r=>{
    const k=r.airline||'未知';
    if(!invByAirline[k])invByAirline[k]={miles:0,cost:0,count:0};
    invByAirline[k].miles+=parseFloat(r.miles)||0;
    invByAirline[k].cost+=(parseFloat(r.total)||0)+(parseFloat(r.fee)||0);
    invByAirline[k].count++;
  });
  const invTotalCost=invRecs.reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
  const invTotalMiles=invRecs.reduce((s,r)=>s+(parseFloat(r.miles)||0),0);

  const rate=getEstRate();
  const ar=getAR();
  const arOwed=Object.values(ar).reduce((s,v)=>s+Math.max(0,v.owed||0),0);
  const cnyAsTwd=totalCNY*rate;
  const arAsTwd=arOwed*rate;
  const grandTotal=totalTWD+cnyAsTwd+arAsTwd+invTotalCost;

  const assetRow=(dot,label,sub,val)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f5f5f7">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:4px;height:34px;border-radius:3px;background:${dot};flex-shrink:0"></div>
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--txt)">${label}</div>
          ${sub?`<div style="font-size:11px;color:var(--txt3);margin-top:1px">${sub}</div>`:''}
        </div>
      </div>
      <div style="font-size:16px;font-weight:800;color:var(--txt);text-align:right">NT$ ${fmt(val)}</div>
    </div>`;

  let html=`<div style="background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px rgba(0,0,0,.09)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3)">全資產概覽</div>
      <div style="font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--txt)">NT$ ${fmt(grandTotal)}</div>
    </div>
    <div style="font-size:11px;color:var(--txt3);text-align:right;margin-bottom:14px;border-bottom:1.5px solid #f2f2f7;padding-bottom:14px">四項合計估算</div>
    ${assetRow('var(--blue)','台幣帳戶','銀行・電子支付・現金',totalTWD)}
    ${cnyAccs.length?assetRow('var(--orange)','人民幣帳戶（折台幣）',`¥ ${fmt(totalCNY)} × ${rate}`,cnyAsTwd):''}
    ${arOwed>0?assetRow('var(--green)','待收款項（折台幣）',`應收 ¥ ${fmt(arOwed)} × ${rate}`,arAsTwd):''}
    ${invTotalMiles>0?assetRow('var(--purple)','哩程庫存成本',`${invTotalMiles} 萬哩 · ${invRecs.length} 筆`,invTotalCost):''}
    <div style="margin-top:14px;display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--txt3);white-space:nowrap">CNY 折算匯率</span>
      <input type="number" value="${rate}" step="0.001" inputmode="decimal"
        style="width:72px;padding:7px 10px;font-size:14px;font-weight:700;border:1.5px solid #e5e5ea;border-radius:9px;background:#f9f9f9;color:var(--txt);text-align:center"
        onchange="saveEstRate(this.value);renderAccounts()">
      <span style="font-size:12px;color:var(--txt3)">TWD/CNY</span>
    </div>
  </div>`;

  typeOrder.forEach(t=>{
    const list=grouped[t];
    if(!list||!list.length)return;
    const isCNY=t==='人民幣帳戶';
    const subtotal=list.reduce((s,a)=>s+getBalance(a.name),0);
    const icon=typeIcon[t]||'📂';
    html+=`<div class="acc-section"><div class="acc-section-title">${icon} ${t} &nbsp;${isCNY?'¥':'NT$'} ${fmt(subtotal)}</div>`;
    list.forEach(a=>{
      const bal=getBalance(a.name);
      const cls=bal>=0?'pos':'neg';
      html+=`<div class="acc-row" onclick="openAccModal(${a.id})">
        <span class="acc-name">${esc(a.name)}</span>
        <span class="acc-bal ${cls}">${isCNY?'¥':'NT$'} ${fmt(bal)}</span>
      </div>`;
    });
    html+='</div>';
  });

  // 哩程庫存 section
  if(invTotalMiles>0){
    html+=`<div class="acc-section"><div class="acc-section-title">📦 哩程庫存 &nbsp;${invTotalMiles}萬哩 · NT$ ${fmt(invTotalCost)}</div>`;
    Object.entries(invByAirline).forEach(([airline,d])=>{
      const al=airline.replace(/'/g,"\\'");

// ─── Month net helper ──────────────────────────────────────
function getActualRate(ym,recs,defRate){
  // Weighted average of actual 換匯 records this month; fall back to defRate
  const ex=recs.filter(r=>r.type==='換匯'&&r.date?.startsWith(ym)&&r.rmb&&r.twd);
  if(!ex.length)return defRate;
  const rmb=ex.reduce((s,r)=>s+(parseFloat(r.rmb)||0),0);
  const twd=ex.reduce((s,r)=>s+(parseFloat(r.twd)||0),0);
  return rmb>0?twd/rmb:defRate;
}
function getMonthNet(ym,recs,profits,storedRates,defRate){
  if(profits[ym]!==undefined) return profits[ym];
  const hasPT=r=>r.profit_twd!==undefined&&r.profit_twd!==''&&r.profit_twd!==null;
  const mr=recs.filter(r=>r.date?.startsWith(ym));
  const sells=mr.filter(r=>r.type==='出貨');
  const buys=mr.filter(r=>r.type==='進貨'&&!r.is_inventory);
  const withP=sells.filter(hasPT);
  const withoutP=sells.filter(r=>!hasPT(r));
  const directP=withP.reduce((s,r)=>s+(parseFloat(r.profit_twd)||0),0);
  const cost=buys.reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
  // Separate TWD-denominated and RMB-denominated 出貨
  const sellRMB=withoutP.filter(r=>r.sell_currency!=='TWD');
  const sellTWD=withoutP.filter(r=>r.sell_currency==='TWD');
  const totalSellTWDDirect=sellTWD.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
  const totalSellRMB=sellRMB.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
  if(storedRates[ym]!==undefined){
    const mrate=storedRates[ym];
    const calcRev=totalSellTWDDirect+sellRMB.reduce((s,r)=>s+(r.twd?parseFloat(r.twd):(parseFloat(r.total)||0)*mrate),0);
    return withP.length>0&&withoutP.length===0?directP:directP+calcRev-cost;
  }
  // Split rate: exchanged portion uses actual TWD received; unexchanged uses defRate estimate
  const ex=recs.filter(r=>r.type==='換匯'&&r.date?.startsWith(ym)&&r.rmb&&r.twd);
  const totalExRMB=ex.reduce((s,r)=>s+(parseFloat(r.rmb)||0),0);
  const totalExTWD=ex.reduce((s,r)=>s+(parseFloat(r.twd)||0),0);
  let calcRev;
  if(totalExRMB===0){
    calcRev=totalSellTWDDirect+totalSellRMB*defRate;
  }else if(totalExRMB>=totalSellRMB){
    calcRev=totalSellTWDDirect+totalSellRMB*(totalExTWD/totalExRMB);
  }else{
    // Partial: actual TWD received + remaining at estimated rate
    calcRev=totalSellTWDDirect+totalExTWD+(totalSellRMB-totalExRMB)*defRate;
  }
  return withP.length>0&&withoutP.length===0?directP:directP+calcRev-cost;
}

const _now=new Date();

const _lastDay=new Date(_y,_now.getMonth()+1,0).getDate();

function calcRange(){
  const fromVal=document.getElementById('range-from')?.value;

  if(!el)return;
  if(!fromVal||!toVal){el.innerHTML='<span style="color:var(--txt3)">選擇起訖日期</span>';return;}

  const to=toVal.substring(0,7);
  if(from>to){el.innerHTML='<span style="color:var(--txt3)">結束日期需晚於開始日期</span>';return;}
  const recs=getRecs();
  const profits=getProfits();
  const storedRates=getRates();

    ...recs.filter(r=>r.type==='出貨'||r.type==='進貨').map(r=>r.date?.substring(0,7)).filter(Boolean),

  ])].sort();
  const inRange=allMonths.filter(ym=>ym>=from&&ym<=to);

}

function showRecordDetail(id){
  const recs=getRecs();
  const rec=recs.find(r=>r.id==id);
  if(!rec)return;
  const ym=rec.date?.substring(0,7)||'';
  const storedRates=getRates();
  const defRate=getEstRate();
  const hasPT=r=>r.profit_twd!==undefined&&r.profit_twd!==''&&r.profit_twd!==null;
  const mrate=storedRates[ym]??getActualRate(ym,recs,defRate);

  // Match by 8+ digit order numbers in note/card
  const searchText=[rec.note,rec.card].filter(Boolean).join(' ');
  const orderNums=(searchText.match(/\d{8,}/g)||[]);
  let related=[],isBatch=false;
  if(orderNums.length>0){
    const recMs=rec.date?new Date(rec.date).getTime():0;
    related=recs.filter(r=>{
      if(r.id===rec.id)return false;
      if(r.type!=='出貨'&&r.type!=='進貨')return false;
      const rt=[r.note,r.card].filter(Boolean).join(' ');
      if(!orderNums.some(n=>rt.includes(n)))return false;
      if(r.date&&recMs){const diff=Math.abs(new Date(r.date).getTime()-recMs);if(diff>60*864e5)return false;}
      return true;
    });
  }
  // Fallback: same date + same airline + vendor name in note/card
  if(related.length===0&&rec.date&&(rec.type==='出貨'||rec.type==='進貨')){
    const sameDay=recs.filter(r=>r.id!==rec.id&&r.date===rec.date);
    let candidates=[];
    if(rec.type==='出貨'&&rec.vendor){
      const v=rec.vendor.toLowerCase();
      candidates=sameDay.filter(r=>r.type==='進貨'&&
        [r.note,r.card].filter(Boolean).join(' ').toLowerCase().includes(v)&&
        (!rec.airline||!r.airline||r.airline===rec.airline));
    }else if(rec.type==='進貨'){
      const noteCard=[rec.note,rec.card].filter(Boolean).join(' ').toLowerCase();
      candidates=sameDay.filter(r=>r.type==='出貨'&&r.vendor&&
        noteCard.includes(r.vendor.toLowerCase())&&
        (!rec.airline||!r.airline||r.airline===rec.airline));
    }
    if(candidates.length===1){related=candidates;}
    else if(candidates.length>1){
      const sNote=(rec.note||'').toLowerCase();
      const sMiles=String(rec.miles||'');
      const scored=candidates.map(b=>{
        const bNote=(b.note||'').toLowerCase();
        let sc=0;
        if(bNote.length>=3&&sNote.includes(bNote))sc+=2;
        if(sNote.length>=3&&bNote.includes(sNote))sc+=2;
        if(sMiles&&sMiles!=='0'&&bNote.includes(sMiles))sc+=1;
        return{b,sc};
      });
      const mx=Math.max(...scored.map(x=>x.sc));
      related=mx>0?scored.filter(x=>x.sc===mx).map(x=>x.b):candidates;
    }
  }

  // Calculate deal profit
  let dealProfit=null,profitNote='';
  if(rec.type==='出貨'){
    if(hasPT(rec)){
      dealProfit=parseFloat(rec.profit_twd);
      profitNote='來自實際記錄';
    }else if(rec.total&&related.length>0){
      const buys=related.filter(r=>r.type==='進貨'&&!r.is_inventory);
      if(buys.length>0){
        const rev=rec.sell_currency==='TWD'?parseFloat(rec.total):parseFloat(rec.total)*mrate;
        if(!isBatch){
          const cost=buys.reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
          dealProfit=rev-cost;
          profitNote=`¥${rec.total} × ${mrate} − NT$${fmt(cost)}`;
        }else{
          // pro-rate by miles across batch
          const batchMiles=buys.reduce((s,r)=>s+(parseFloat(r.miles)||0),0);
          const batchCost=buys.reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
          const perW=batchMiles>0?batchCost/batchMiles:0;
          const thisMiles=parseFloat(rec.miles)||0;
          const cost=perW>0&&thisMiles>0?perW*thisMiles:batchCost;
          dealProfit=rev-cost;
          profitNote=`批次均攤 @NT$${perW.toFixed(0)}/萬哩`;
        }
      }
    }
  }else if(rec.type==='進貨'){
    const allSells=related.filter(r=>r.type==='出貨');
    const allBuys=[rec,...related.filter(r=>r.type==='進貨')];
    if(allSells.length>0){
      const sell=allSells[0];
      if(!isBatch&&hasPT(sell)){
        dealProfit=parseFloat(sell.profit_twd);
        profitNote='來自出貨實際記錄';
      }else{
        const totalRev=allSells.reduce((s,r)=>r.sell_currency==='TWD'?s+(parseFloat(r.total)||0):s+(parseFloat(r.total)||0)*mrate,0);
        const totalCost=allBuys.reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
        dealProfit=totalRev-totalCost;
        profitNote=isBatch?`批次總利潤（${allSells.length} 筆出貨）`:`¥${sell.total} × ${mrate} − NT$${fmt(totalCost)}`;
      }
    }
  }

  // Build display
  const mainLine=rec.type==='出貨'?[rec.vendor,rec.airline].filter(Boolean).join(' · ')
    :rec.type==='進貨'?[rec.seller,rec.airline].filter(Boolean).join(' · ')
    :rec.vendor||rec.channel||rec.account||'';
  const subLine=[rec.miles&&rec.miles+'萬哩',rec.unitprice&&'@'+rec.unitprice].filter(Boolean).join(' ');
  const amtLine=rec.type==='出貨'
    ?(hasPT(rec)?`<span class="blue">NT$ ${fmt(parseFloat(rec.twd)||0)}</span>`:(rec.total?`<span class="blue">${rec.sell_currency==='TWD'?'+NT$':'+¥'}${rec.total}</span>`:''))
    :rec.type==='進貨'?(rec.total?`<span class="red">-NT$ ${fmt((parseFloat(rec.total)||0)+(parseFloat(rec.fee)||0))}</span>${rec.buy_currency==='RMB'?`<br><span style="font-size:11px;color:var(--txt3)">¥${rec.buy_rmb||rec.total} × ${rec.buy_rate||'?'}</span>`:''}`:'')
    :rec.type==='理賠'?(rec.twd?`<span style="color:var(--claim);font-size:18px;font-weight:800">-NT$ ${fmt(parseFloat(rec.twd)||0)}</span>`:''):'';

  // Related records (max 5, with overflow count)
  let relatedHTML='';
  if(related.length>0){
    const show=related.slice(0,5);
    const more=related.length-show.length;
    relatedHTML='<div style="margin-top:14px"><div style="font-size:11px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">'+(isBatch?'批次關聯記錄':'關聯記錄')+'</div>';
    show.forEach(r=>{
      const rm=r.type==='出貨'?[r.vendor,r.airline].filter(Boolean).join(' · '):[r.seller,r.airline].filter(Boolean).join(' · ');
      const ra=r.type==='出貨'?(hasPT(r)?`<span class="blue">NT$${fmt(parseFloat(r.twd)||0)}</span>`:(r.total?`<span class="blue">+¥${r.total}</span>`:'')):(r.total?`<span class="red">-NT$${r.total}</span>`:'');
      relatedHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f2f2f7;font-size:13px"><div><span class="badge b-${r.type}" style="font-size:10px;padding:2px 7px">${r.type}</span> <span style="font-weight:500">${esc(rm)}</span>${r.miles?` <span style="color:var(--txt3)">${r.miles}萬哩</span>`:''}</div><span style="font-weight:700">${ra}</span></div>`;
    });
    if(more>0)relatedHTML+=`<div style="padding:8px 0;font-size:12px;color:var(--txt3);text-align:center">…還有 ${more} 筆</div>`;
    relatedHTML+='</div>';
  }

  // 理賠 detail
  let claimHTML='';
  if(rec.type==='理賠'){
    const rows=[
      rec.vendor&&['退費對象',rec.vendor],
      rec.rmb&&['退還金額（RMB）',`¥ ${fmt(parseFloat(rec.rmb))}`],
      rec.rate&&['換算匯率',`${rec.rate} TWD/CNY`],

      rec.account&&['收款帳戶',rec.account+(accAfter!==null?`（現 NT$${fmt(accAfter)}）`:'')],
      rec.from_vendor&&['款項來自廠商',rec.from_vendor],

    ].filter(Boolean);
    exchangeHTML=`<div style="margin-top:14px;background:#f9f9f9;border-radius:12px;padding:14px">
      ${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f2f2f7;font-size:13px"><span style="color:var(--txt3)">${k}</span><span style="font-weight:600">${esc(String(v))}</span></div>`).join('')}
    </div>`;

    ?`<div style="margin-top:16px;padding:16px;background:linear-gradient(135deg,#f0fff4,#e8f4ff);border-radius:14px;text-align:center">
        <div style="font-size:11px;color:var(--txt2);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">此筆淨利</div>
        <div class="${dealProfit>=0?'green':'red'}" style="font-size:28px;font-weight:800;letter-spacing:-.5px">NT$ ${fmt(dealProfit)}</div>
        ${profitNote?`<div style="font-size:11px;color:var(--txt3);margin-top:6px">${esc(profitNote)}</div>`:''}
      </div>`
    :(rec.type==='出貨'||rec.type==='進貨'?`<div style="margin-top:14px;padding:12px;background:#f9f9f9;border-radius:12px;text-align:center;color:var(--txt3);font-size:13px">未找到關聯記錄，無法計算單筆利潤</div>`:'');

  const payBadge=rec.type==='出貨'
    ?(rec.payment_status==='paid'
      ?`<div style="margin-top:8px;font-size:13px"><span style="background:#d4f4dd;color:#1a7a36;border-radius:6px;padding:3px 9px;font-weight:600">✓ 已付款</span>${rec.paid_to?` → <span style="color:var(--txt2)">${esc(rec.paid_to)}</span>`:''}</div>`
      :`<div style="margin-top:8px;font-size:13px"><span style="background:#fff3cd;color:#856404;border-radius:6px;padding:3px 9px;font-weight:600">⏳ 未付款</span> <span style="color:var(--txt3);font-size:12px">（應收帳款中）</span></div>`)
    :'';
  const inventoryBadge=rec.type==='進貨'
    ?`<div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;${rec.is_inventory?'background:#fff3e0;color:#c96500':'background:#f2f2f7;color:var(--txt2)'};border-radius:6px;padding:3px 10px;font-weight:600">${rec.is_inventory?'📦 哩程庫存中':'已售出 / 非庫存'}</span>
        <button onclick="toggleInventory(${rec.id})" style="font-size:12px;padding:4px 12px;border-radius:8px;border:1.5px solid #e5e5ea;background:#fff;color:var(--blue);cursor:pointer;font-weight:600">${rec.is_inventory?'標記已售出':'移入庫存'}</button>
      </div>`
    :'';

  document.getElementById('modal-deal-title').textContent=`${rec.type} · ${rec.date}`;
  document.getElementById('modal-deal-body').innerHTML=`
    <div style="background:#f9f9f9;border-radius:12px;padding:14px">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">${esc(mainLine)}</div>
      ${subLine?`<div style="font-size:13px;color:var(--txt2);margin-bottom:4px">${subLine}</div>`:''}
      ${rec.note?`<div style="font-size:12px;color:var(--txt3)">${esc(rec.note)}</div>`:''}
      <div style="margin-top:10px;font-size:16px;font-weight:700">${amtLine}</div>

  let html=`<div style="background:linear-gradient(135deg,#fff3e0,#ffe0b2);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:11px;color:#c96500;font-weight:700;margin-bottom:2px">總庫存</div><div style="font-size:26px;font-weight:900;color:#c96500">${totalMiles}萬哩</div></div>
    <div style="text-align:right"><div style="font-size:11px;color:var(--txt2);margin-bottom:2px">成本合計</div><div style="font-size:18px;font-weight:800">NT$ ${fmt(totalCost)}</div></div>
  </div>`;

    html+=`<div style="background:#f9f9f9;border-radius:12px;padding:13px 14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-size:14px;font-weight:700">${miles}萬哩</div>
          <div style="font-size:12px;color:var(--txt2);margin-top:2px">${r.date}${r.seller?' · '+esc(r.seller):''}</div>
          ${r.note?`<div style="font-size:11px;color:var(--txt3);margin-top:2px">${esc(r.note)}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:var(--red)">NT$ ${fmt(cost)}</div>
          <div style="font-size:11px;color:var(--txt3);margin-top:1px">@${r.unitprice||'?'}/哩</div>
        </div>
      </div>
      <button onclick="closeInvDetail();openInvSell(${r.id},${miles})" style="width:100%;padding:9px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">出售此批哩程</button>
    </div>`;
  });
  document.getElementById('inv-detail-body').innerHTML=html;
  document.getElementById('modal-inv-detail').classList.add('open');
}
function closeInvDetail(){document.getElementById('modal-inv-detail').classList.remove('open');}

let _invSellSrcId=null;
function openInvSell(recordId,maxMiles){
  const rec=getRecs().find(r=>r.id===recordId);
  if(!rec)return;
  _invSellSrcId=recordId;
  document.getElementById('inv-sell-title').textContent=`售出 ${rec.airline||''} 庫存`;
  document.getElementById('inv-sell-src').innerHTML=`來源：<b>${esc(rec.seller||'—')}</b> · ${rec.date} · <b>${maxMiles}萬哩</b> · 成本 NT$ ${fmt((parseFloat(rec.total)||0)+(parseFloat(rec.fee)||0))}`;
  document.getElementById('inv-sell-miles').value=maxMiles;
  document.getElementById('inv-sell-miles').max=maxMiles;
  document.getElementById('inv-sell-vendor').value='';
  document.getElementById('inv-sell-up').value='';
  document.getElementById('inv-sell-date').value=today();
  document.getElementById('inv-sell-note').value='';
  document.getElementById('modal-inv-sell').classList.add('open');
}
function closeInvSell(){document.getElementById('modal-inv-sell').classList.remove('open');}
function submitInvSell(){
  const miles=parseFloat(document.getElementById('inv-sell-miles').value);
  const vendor=document.getElementById('inv-sell-vendor').value.trim();
  const up=parseFloat(document.getElementById('inv-sell-up').value);
  const date=document.getElementById('inv-sell-date').value||today();
  const note=document.getElementById('inv-sell-note').value.trim();
  if(!miles||isNaN(miles)){toast('請填寫售出萬哩數');return;}
  if(!vendor){toast('請填寫廠商名稱');return;}
  if(!up||isNaN(up)){toast('請填寫每萬哩單價');return;}
  const recs=getRecs();
  const srcIdx=recs.findIndex(r=>r.id===_invSellSrcId);
  if(srcIdx<0){toast('找不到原始記錄');return;}
  const src=recs[srcIdx];
  const srcMiles=parseFloat(src.miles)||0;
  const srcTotal=(parseFloat(src.total)||0)+(parseFloat(src.fee)||0);
  const total=(miles*up).toFixed(0);
  const newSell={id:Date.now(),type:'出貨',date,vendor,airline:src.airline||'',miles:String(miles),unitprice:String(up),total,payment_status:'unpaid',note:note||`庫存 ${src.seller?esc(src.seller):''}`};
  const isPartial=miles<srcMiles-0.001;
  if(isPartial){
    const remMiles=Math.round((srcMiles-miles)*100)/100;
    const remCost=Math.round(srcTotal*remMiles/srcMiles);
    delete recs[srcIdx].is_inventory;
    const remainder={...src,id:Date.now()+2,miles:String(remMiles),total:String(remCost),fee:undefined,note:`[剩餘庫存] ${src.note||''}`.trim(),is_inventory:true};
    delete remainder.fee;
    recs.splice(0,0,remainder);
  }else{
    delete recs[srcIdx].is_inventory;
  }
  recs.splice(0,0,newSell);
  saveRecs(recs);
  const ar=getAR();
  if(!ar[vendor])ar[vendor]={owed:0};
  ar[vendor].owed=(ar[vendor].owed||0)+parseFloat(total);
  saveAR(ar);
  logActivity('庫存售出',`${src.airline} ${miles}W → ${vendor} @${up}`);
  closeInvSell();
  toast(`✓ 出貨記錄已建立，AR +¥${fmt(parseFloat(total))}`);
  renderRecords();
  if(document.getElementById('sec-acc').classList.contains('active'))renderAccounts();
  if(document.getElementById('sec-sum').classList.contains('active'))renderSummary();
}
document.getElementById('modal-inv-detail').addEventListener('click',function(e){if(e.target===this)closeInvDetail();});
document.getElementById('modal-inv-sell').addEventListener('click',function(e){if(e.target===this)closeInvSell();});

function toggleInventory(id){
  const recs=getRecs();
  const idx=recs.findIndex(r=>r.id===id);
  if(idx<0)return;
  const wasInv=recs[idx].is_inventory;
  if(wasInv){delete recs[idx].is_inventory;}
  else{recs[idx].is_inventory=true;}
  saveRecs(recs);
  logActivity(wasInv?'移出庫存':'移入庫存',`${recs[idx].airline||''} ${recs[idx].miles||''}萬哩`);
  toast(wasInv?'已標記為已售出':'已加入哩程庫存');
  closeRecordDetail();
  renderRecords();
  if(document.getElementById('sec-acc').classList.contains('active'))renderAccounts();
}

// ─── Render Summary ────────────────────────────────────────
function lockMonth(ym){
  const recs=getRecs(),profits=getProfits(),storedRates=getRates();
  const defRate=getEstRate();
  const net=getMonthNet(ym,recs,profits,storedRates,defRate);
  const [y,m]=ym.split('-');
  if(!confirm(`鎖定 ${y}年${parseInt(m)}月 月結淨利 NT$${fmt(net)}？\n\n鎖定後此月份不會因新增或刪除記錄改變數字。\n（日後可隨時解鎖重新計算）`))return;
  profits[ym]=net;
  saveProfits(profits);
  logActivity('鎖定月份',`${ym} NT$${fmt(net)}`);
  renderSummary();
  toast(`🔒 ${y}年${parseInt(m)}月 已鎖定`);
}
function unlockMonth(ym){
  const [y,m]=ym.split('-');
  if(!confirm(`解鎖 ${y}年${parseInt(m)}月？\n解鎖後將重新從紀錄動態計算。`))return;
  const profits=getProfits();
  delete profits[ym];
  saveProfits(profits);
  logActivity('解鎖月份',ym);
  renderSummary();
  toast(`🔓 ${y}年${parseInt(m)}月 已解鎖`);
}
function renderSummary(){
  const recs=getRecs();
  const rate=getEstRate();
  const sumF=(list,field)=>list.reduce((s,r)=>s+(parseFloat(r[field])||0),0);
  const profits=getProfits();
  const storedRates=getRates();

  const recMonths=[...new Set(recs.filter(r=>r.type==='出貨'||r.type==='進貨').map(r=>r.date?.substring(0,7)).filter(Boolean))];
  const months=[...new Set([...recMonths,...Object.keys(profits)])].sort().reverse();
  let totalNet=0;
  const inputStyle='flex:1;padding:9px 10px;font-size:14px;font-weight:500;border:1.5px solid #e5e5ea;border-radius:10px;background:#fff;color:var(--txt);-webkit-appearance:none';
  const rfCurrent=document.getElementById('range-from')?.value||rangeFrom||'';
  const rtCurrent=document.getElementById('range-to')?.value||rangeTo||today();

  const monthCards=months.map(ym=>{
    const net=getMonthNet(ym,recs,profits,storedRates,rate);
    totalNet+=net;
    const isConfirmed=profits[ym]!==undefined;
    const mr=recs.filter(r=>r.date?.startsWith(ym));
    const recsSell=mr.filter(r=>r.type==='出貨');
    const recsBuy=mr.filter(r=>r.type==='進貨');
    const [y,m]=ym.split('-');
    const label=`${y}年${parseInt(m)}月`;
    const cls=net>=0?'green':'red';
    const taxR=mr.filter(r=>r.type==='稅金');
    const taxLine=taxR.length?`<div class="sc-r"><span>代付稅金</span><span class="sc-v red">-NT$ ${fmt(sumF(taxR,'twd'))}</span></div>`:'';
    const totalRecs=recsSell.length+recsBuy.length;

    const lockBtnStyle='font-size:11px;padding:3px 10px;border-radius:7px;border:1.5px solid #e5e5ea;background:#fff;cursor:pointer;white-space:nowrap';
    const hdBgLock='background:linear-gradient(135deg,#ede8ff,#dde8ff)';
    const hdBgProfit=net>=0?'background:linear-gradient(135deg,#edfff4,#d6f9e6)':'background:linear-gradient(135deg,#fff3f3,#fde0e0)';
    if(isConfirmed&&totalRecs===0){
      return `<div class="sc-month">
        <div class="sc-month-hd" style="${hdBgLock}">
          <span class="sc-month-title">🔒 ${label}</span>
          <span class="sc-month-net ${cls}">NT$ ${fmt(net)}</span>
        </div>
        <div class="sc-month-body">
          <div class="sc-r"><span style="font-weight:600;color:var(--txt)">已鎖定淨利</span><span class="sc-v ${cls}" style="font-size:15px">NT$ ${fmt(net)}</span></div>
          <div style="text-align:right;margin-top:6px"><button onclick="unlockMonth('${ym}')" style="${lockBtnStyle};color:var(--txt3)">🔓 解鎖重算</button></div>
        </div>
      </div>`;
    }
    if(isConfirmed){
      return `<div class="sc-month">
        <div class="sc-month-hd" onclick="gotoMonth('${ym}')" style="${hdBgLock};cursor:pointer">
          <span class="sc-month-title">🔒 ${label}</span>
          <span style="display:flex;align-items:baseline;gap:8px"><span class="sc-month-net ${cls}">NT$ ${fmt(net)}</span><span style="font-size:11px;color:var(--txt3)">明細 →</span></span>
        </div>
        <div class="sc-month-body">
          <div class="sc-r"><span>出貨 ${recsSell.length} 筆 ／ 進貨 ${recsBuy.length} 筆</span><span class="sc-v" style="color:var(--txt3)">共 ${totalRecs} 筆</span></div>
          ${taxLine}
          <div class="sc-r"><span style="font-weight:600;color:var(--txt)">已鎖定淨利</span><span class="sc-v ${cls}" style="font-size:15px">NT$ ${fmt(net)}</span></div>
          <div style="text-align:right;margin-top:6px"><button onclick="unlockMonth('${ym}')" style="${lockBtnStyle};color:var(--txt3)">🔓 解鎖重算</button></div>
        </div>
      </div>`;
    }
    const hasPT=r=>r.profit_twd!==undefined&&r.profit_twd!==''&&r.profit_twd!==null;
    const withoutProfit=recsSell.filter(r=>!hasPT(r));
    const hasStoredRate=storedRates[ym]!==undefined;
    // Separate TWD and RMB sales
    const sellRMBRecs=withoutProfit.filter(r=>r.sell_currency!=='TWD');
    const sellTWDRecs=withoutProfit.filter(r=>r.sell_currency==='TWD');
    const totalSellTWDDirect=sellTWDRecs.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
    // Split rate breakdown (only for RMB portion)
    const exRecs=recs.filter(r=>r.type==='換匯'&&r.date?.startsWith(ym)&&r.rmb&&r.twd);
    const totalExRMB=exRecs.reduce((s,r)=>s+(parseFloat(r.rmb)||0),0);
    const totalExTWD=exRecs.reduce((s,r)=>s+(parseFloat(r.twd)||0),0);
    const actualRate=totalExRMB>0?totalExTWD/totalExRMB:0;
    const totalSellRMB=sellRMBRecs.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
    const pendRMB=Math.max(0,totalSellRMB-totalExRMB);
    const isSplit=!hasStoredRate&&totalExRMB>0&&pendRMB>0;
    const mrate=hasStoredRate?storedRates[ym]:(totalExRMB>0?actualRate:rate);
    let rateDisplay,calcRevTwd;
    if(hasStoredRate){
      rateDisplay=`手動 ${storedRates[ym].toFixed(4)}`;
      calcRevTwd=totalSellTWDDirect+sellRMBRecs.reduce((s,r)=>s+(parseFloat(r.total)||0)*storedRates[ym],0);
    }else if(isSplit){
      rateDisplay=`已換 @${actualRate.toFixed(4)} + 待換 @${rate}（估）`;
      calcRevTwd=totalSellTWDDirect+totalExTWD+pendRMB*rate;
    }else if(totalExRMB>0){
      rateDisplay=`實際均值 ${actualRate.toFixed(4)}`;
      calcRevTwd=totalSellTWDDirect+totalSellRMB*actualRate;
    }else{
      rateDisplay=`估算 ${rate}`;
      calcRevTwd=totalSellTWDDirect+totalSellRMB*rate;
    }
    const cost=recsBuy.filter(r=>!r.is_inventory).reduce((s,r)=>s+(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),0);
    const invBuyCount=recsBuy.filter(r=>r.is_inventory).length;
    const splitDetail=isSplit?`<div style="font-size:11px;color:var(--txt3);padding:0 0 4px">已換 ¥${fmt(Math.min(totalSellRMB,totalExRMB))} → NT$${fmt(totalExTWD)}・待換 ¥${fmt(pendRMB)} × ${rate} = NT$${fmt(pendRMB*rate)}</div>`:'';
    return `<div class="sc-month">
      <div class="sc-month-hd" onclick="gotoMonth('${ym}')" style="${hdBgProfit};cursor:pointer">
        <span class="sc-month-title">${label}</span>
        <span style="display:flex;align-items:baseline;gap:8px"><span class="sc-month-net ${cls}">NT$ ${fmt(net)}</span><span style="font-size:11px;color:var(--txt3)">明細 →</span></span>
      </div>
      <div class="sc-month-body">
        <div class="sc-r" style="padding:6px 0 10px">
          <span style="color:var(--txt2);font-size:13px">${rateDisplay}</span>
          ${hasStoredRate?`<input type="number" value="${storedRates[ym].toFixed(4)}" step="0.01" inputmode="decimal" style="width:80px;padding:6px 10px;font-size:14px;font-weight:600;border-radius:8px;text-align:right" onchange="setMonthRate('${ym}',this.value)" onclick="event.stopPropagation()">`:
          `<input type="number" placeholder="${rate}" step="0.01" inputmode="decimal" style="width:80px;padding:6px 10px;font-size:14px;font-weight:600;border-radius:8px;text-align:right;background:#f9f9f9;color:var(--txt3)" title="手動鎖定匯率（覆蓋估算）" onchange="setMonthRate('${ym}',this.value)" onclick="event.stopPropagation()">`}
        </div>
        ${splitDetail}
        <div class="sc-r"><span>出貨收入${sellTWDRecs.length>0?`<span style="font-size:10px;color:var(--blue);margin-left:4px">（含 ${sellTWDRecs.length} 筆 TWD）</span>`:''}</span><span class="sc-v blue">NT$ ${fmt(calcRevTwd)}</span></div>
        <div class="sc-r"><span>進貨成本${invBuyCount>0?`<span style="font-size:10px;color:var(--orange);margin-left:4px">（庫存 ${invBuyCount} 筆不計）</span>`:''}</span><span class="sc-v red">-NT$ ${fmt(cost)}</span></div>
        ${taxLine}
        <div class="sc-r"><span style="font-weight:600;color:var(--txt)">淨利</span><span class="sc-v ${cls}" style="font-size:15px">NT$ ${fmt(net)}</span></div>
        <div style="text-align:right;margin-top:8px"><button onclick="lockMonth('${ym}')" style="${lockBtnStyle};color:#1a7a36;border-color:#b8e6c4">🔒 鎖定月結</button></div>
      </div>
    </div>`;
  }).join('');

  const lastSync=localStorage.getItem('ml_last_sync');
  document.getElementById('sum-body').innerHTML=`

    const mkRow=(vendor,owed)=>{
      const isOwed=(owed||0)>0;

        onchange="saveEstRate(this.value);renderSummary()" onclick="event.stopPropagation()">
      <span style="font-size:12px;color:var(--txt3)">TWD/CNY</span>
      ${totalOwed>0?`<span style="flex:1;text-align:right;font-size:14px;font-weight:700;color:var(--orange)">≈ NT$ ${fmt(totalOwed*rate)}</span>`:'<span style="flex:1;text-align:right;font-size:12px;color:var(--txt3)">無待換金額</span>'}

    return `<div class="sc" style="margin-bottom:14px">

      ${rateRow}
      ${settledToggle}
    </div>`;
  })()}
  ${monthCards}`;
  if(rfCurrent||rtCurrent) setTimeout(calcRange,0);
}

// ─── AR (Accounts Receivable) ──────────────────────────────
function markVendorReceived(vendor){openARSettle(vendor);}
function deleteAREntry(vendor){
  if(!confirm(`確認刪除「${vendor}」的應收帳款記錄？`))return;
  const ar=getAR();
  delete ar[vendor];
  saveAR(ar);
  logActivity('刪除AR廠商',vendor);
  renderSummary();populateExchangeVendors();
}
function editARAmount(vendor){
  const ar=getAR();
  const cur=(ar[vendor]?.owed||0).toFixed(0);
  const val=prompt(`${vendor} 應收金額（CNY）：`,cur);
  if(val===null)return;
  const num=parseFloat(val);
  if(isNaN(num))return;
  if(!ar[vendor])ar[vendor]={owed:0};
  ar[vendor].owed=num;
  saveAR(ar);
  renderSummary();
  populateExchangeVendors();
}
function addAREntry(){
  const vendor=prompt('廠商名稱：');
  if(!vendor||!vendor.trim())return;
  const val=prompt(`${vendor.trim()} 目前欠款（CNY）：`,'0');
  if(val===null)return;
  const ar=getAR();
  ar[vendor.trim()]={owed:parseFloat(val)||0};
  saveAR(ar);
  renderSummary();
  populateExchangeVendors();
}
function populateExchangeVendors(){
  const sel=document.getElementById('x-from');
  if(!sel)return;
  const ar=getAR();
  const cur=sel.value;
  sel.innerHTML='<option value="">— 不選 —</option>';
  Object.entries(ar)
    .filter(([,v])=>(v.owed||0)>0)
    .sort((a,b)=>b[1].owed-a[1].owed)
    .forEach(([vendor,{owed}])=>{
      const opt=document.createElement('option');
      opt.value=vendor;
      opt.textContent=`${vendor}（¥${fmt(owed)} 未收）`;
      if(vendor===cur)opt.selected=true;
      sel.appendChild(opt);
    });
  // Also add zero-balance vendors so user can pick them too
  Object.entries(ar)
    .filter(([,v])=>(v.owed||0)<=0)
    .forEach(([vendor])=>{
      const opt=document.createElement('option');
      opt.value=vendor;
      opt.textContent=vendor+'（已結清）';
      sel.appendChild(opt);
    });
}

function renderAccTx(accName,isCNY){
  const recs=getRecs();
  const tx=[];
  if(isCNY){
    recs.forEach(r=>{
      if(r.type==='出貨'&&r.payment_status==='paid'&&r.paid_to===accName&&r.sell_currency!=='TWD')
        tx.push({date:r.date,desc:`出貨收款 ${r.vendor||''}`,amt:parseFloat(r.total)||0,sign:1});
      if(r.type==='換匯'&&r.from_account===accName)
        tx.push({date:r.date,desc:`換匯出 → ${r.account||''}`,amt:parseFloat(r.rmb)||0,sign:-1});
    });
    const ar=getAR();
    Object.entries(ar).forEach(([v,e])=>{if(e.settled_to===accName&&e.settled_amount&&e.settled_at)tx.push({date:e.settled_at,desc:`${v} AR結清`,amt:parseFloat(e.settled_amount)||0,sign:1});});
  }else{
    recs.forEach(r=>{
      if(r.type==='進貨'&&r.payment===accName)tx.push({date:r.date,desc:`進貨 ${r.seller||''}${r.buy_currency==='RMB'?' (RMB購入)':''}`,amt:(parseFloat(r.total)||0)+(parseFloat(r.fee)||0),sign:-1});
      if(r.type==='換匯'&&r.account===accName)tx.push({date:r.date,desc:`換匯入 ${r.channel||''}`,amt:parseFloat(r.twd)||0,sign:1});
      if(r.type==='稅金'&&r.card===accName)tx.push({date:r.date,desc:`稅金 ${r.vendor||''}`,amt:parseFloat(r.twd)||0,sign:-1});
      if(r.type==='其他'&&r.account===accName)tx.push({date:r.date,desc:r.desc||'其他',amt:parseFloat(r.amount)||0,sign:r.dir==='收入'?1:-1});
      if(r.type==='出貨'&&r.payment_status==='paid'&&r.paid_to===accName&&r.sell_currency==='TWD')tx.push({date:r.date,desc:`出貨收款 ${r.vendor||''} (TWD)`,amt:parseFloat(r.total)||0,sign:1});
    });
  }
  tx.sort((a,b)=>b.date.localeCompare(a.date));
  if(!tx.length)return '<div style="text-align:center;color:var(--txt3);padding:16px;font-size:13px">尚無交易記錄</div>';
  const sym=isCNY?'¥':'NT$';
  return tx.slice(0,30).map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f2f2f7"><div><div style="font-size:13px;font-weight:500">${esc(t.desc)}</div><div style="font-size:11px;color:var(--txt3)">${t.date}</div></div><span class="${t.sign>0?'green':'red'}" style="font-weight:700;font-size:14px">${t.sign>0?'+':'-'}${sym}${fmt(t.amt)}</span></div>`).join('');
}

function populateSellPayDest(){
  const sel=document.getElementById('s-pay-dest');

  const cur=sel.value;
  sel.innerHTML='<option value="">選擇帳戶</option>';

let _settleVendor='';
function openARSettle(vendor){
  _settleVendor=vendor;
  const ar=getAR();
  const owed=ar[vendor]?.owed||0;
  document.getElementById('modal-ar-settle-title').textContent=`${vendor} 結清 ¥${fmt(owed)}`;
  document.getElementById('settle-rmb').value=owed;
  document.getElementById('settle-rate').value='';
  document.getElementById('settle-twd').value='';
  document.getElementById('settle-ch').value='';
  // Populate TWD accounts
  const twdSel=document.getElementById('settle-twd-acc');
  twdSel.innerHTML='<option value="">選擇帳戶</option>';
  getAccounts().filter(a=>a.type!=='人民幣帳戶').forEach(a=>{const o=document.createElement('option');o.value=a.name;o.textContent=a.name;twdSel.appendChild(o);});
  // Populate CNY accounts
  const cnySel=document.getElementById('settle-acc');
  cnySel.innerHTML='<option value="">選擇帳戶</option>';
  getAccounts().filter(a=>a.type==='人民幣帳戶').forEach(a=>{const o=document.createElement('option');o.value=a.name;o.textContent=`${a.name}（¥${fmt(getBalance(a.name))}）`;cnySel.appendChild(o);});
  // Default flow
  showSettleFlow('exchange');
  setSeg('settle-type-seg',document.querySelector('#settle-type-seg .seg-opt'));
  document.getElementById('modal-ar-settle').classList.add('open');
}
function showSettleFlow(type){
  document.getElementById('settle-flow-exchange').style.display=type==='exchange'?'block':'none';
  document.getElementById('settle-flow-account').style.display=type==='account'?'block':'none';
}
function confirmARSettle(){
  const ar=getAR();
  const owed=ar[_settleVendor]?.owed||0;
  const type=segVal('settle-type-seg');
  if(type==='exchange'){
    const rmb=parseFloat(document.getElementById('settle-rmb').value)||owed;
    const rate=parseFloat(document.getElementById('settle-rate').value);
    const twd=parseFloat(document.getElementById('settle-twd').value);
    const acc=document.getElementById('settle-twd-acc').value;
    const ch=(document.getElementById('settle-ch').value||'').trim()||_settleVendor+'打款換匯';
    if(!rate||!twd||!acc){toast('請填寫匯率、台幣金額和收款帳戶');return;}
    const rec={id:Date.now(),type:'換匯',date:today(),channel:ch,rmb:String(rmb),twd:String(twd),rate:String(rate),account:acc,from_vendor:_settleVendor,note:`${_settleVendor} AR結清換匯`};
    const recs=getRecs();recs.unshift(rec);saveRecs(recs);
    ar[_settleVendor].owed=Math.max(0,(ar[_settleVendor].owed||0)-rmb);
    ar[_settleVendor].settled_to=acc;ar[_settleVendor].settled_at=today();
    saveAR(ar);
    logActivity('AR結清換匯',`${_settleVendor} ¥${fmt(rmb)} @${rate} → NT$${fmt(twd)} → ${acc}`);
    toast(`✓ 換匯結清 ¥${fmt(rmb)} → NT$${fmt(twd)} 到 ${acc}`);
  }else{
    const acc=document.getElementById('settle-acc').value;
    if(!acc){toast('請選擇帳戶');return;}
    ar[_settleVendor].settled_amount=owed;
    ar[_settleVendor].settled_to=acc;ar[_settleVendor].settled_at=today();
    ar[_settleVendor].owed=0;
    saveAR(ar);
    logActivity('AR收到帳戶',`${_settleVendor} ¥${fmt(owed)} → ${acc}`);
    toast(`✓ ¥${fmt(owed)} 已收到 ${acc}`);
  }
  document.getElementById('modal-ar-settle').classList.remove('open');
  renderSummary();populateExchangeVendors();
}

function populateCNYAccounts(){
  const sel=document.getElementById('x-from-acc');
  if(!sel)return;
  const cur=sel.value;
  sel.innerHTML='<option value="">— 不選 —</option>';
  getAccounts().filter(a=>a.type==='人民幣帳戶').forEach(a=>{
    const opt=document.createElement('option');
    opt.value=a.name;
    const bal=getBalance(a.name);
    opt.textContent=`${a.name}（¥${fmt(bal)} 餘額）`;
    if(a.name===cur)opt.selected=true;
    sel.appendChild(opt);
  });
}

// ─── Export CSV ────────────────────────────────────────────
function exportCSV(){
  const recs=getRecs();
  const filter=document.getElementById('sec-rec').classList.contains('active')?curFilter:'全部';
  const list=filter==='全部'?recs:recs.filter(r=>r.type===filter);
  if(!list.length){toast('沒有資料');return;}
  const hdr=['日期','類型','廠商/賣家/管道','航空','哩程(萬)','單價','總金額','幣別','帳戶','備註'];
  const rows=list.map(r=>{
    if(r.type==='出貨')return[r.date,'出貨',r.vendor,r.airline,r.miles,r.unitprice+'RMB/萬',r.total,'RMB','',r.note];
    if(r.type==='進貨')return[r.date,'進貨',r.seller,r.airline,r.miles,r.unitprice+'TWD/哩',r.total,'TWD',r.payment,r.note];
    if(r.type==='換匯')return[r.date,'換匯',r.channel,'','','',r.rmb+'→'+r.twd,'CNY→TWD',r.account,r.note];
    if(r.type==='稅金')return[r.date,'稅金',r.vendor,'','','',r.twd+'TWD/'+r.rmb+'RMB','',r.card,r.note];
    if(r.type==='其他')return[r.date,'其他','','','','',r.amount,'TWD',r.account,r.desc];
    if(r.type==='理賠')return[r.date,'理賠',r.vendor,'','','',r.twd,'TWD','',r.desc||''];
    return[];
  });
  const csv=[hdr,...rows].map(row=>row.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`里程記帳_${today()}.csv`; a.click();
}

function exportJSON(){
  const data={records:getRecs(),accounts:getAccounts(),exported:today()};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='里程記帳_'+today()+'.json';a.click();

function openImport(){
  document.getElementById('import-text').value='';
  document.getElementById('import-file').value='';
  document.getElementById('modal-import').classList.add('open');
}
function closeImport(){document.getElementById('modal-import').classList.remove('open');}
function readFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{document.getElementById('import-text').value=e.target.result;};
  reader.readAsText(file);
}
function doImport(){
  const txt=document.getElementById('import-text').value.trim();
  if(!txt){toast('請貼上 JSON 資料');return;}
  let data;
  try{data=JSON.parse(txt);}catch(e){toast('格式錯誤，請確認 JSON');return;}
  const newRecs=Array.isArray(data)?data:(data.records||[]);
  if(!newRecs.length){toast('沒有找到紀錄');return;}
  const existing=getRecs();
  const existingIds=new Set(existing.map(r=>r.id));
  const toAdd=newRecs.filter(r=>r.id&&!existingIds.has(r.id));
  const toUpdate=newRecs.filter(r=>r.id&&existingIds.has(r.id));
  const updatedExisting=existing.map(r=>{const u=toUpdate.find(x=>x.id===r.id);return u||r;});
  const merged=[...toAdd,...updatedExisting].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id-a.id));
  saveRecs(merged);
  if(data.accounts){
    const existAcc=getAccounts();
    const existAccIds=new Set(existAcc.map(a=>a.id));
    const newAccs=(data.accounts||[]).filter(a=>a.id&&!existAccIds.has(a.id));
